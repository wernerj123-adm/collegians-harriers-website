# Builds the staging package from develop and uploads it to the staging site.
#
# Runs on every push to develop, including merged portal review requests and
# Publish Results.cmd. It uses the same package builder and checks as a manual
# release, uploads only files that changed, then runs the drift check against
# the live staging site. Nothing reaches the public site from here: production
# still needs a reviewed pull request into main.
#
# Uploads over SSH (scripts/ssh-upload.sh) when the DEPLOY_SSH_KEY secret exists, exactly as
# deploy-production.yml does; see there for the optional host key and port.
# Without the key it falls back to FTPS, which needs an FTP account whose home
# directory is the staging document root,
# /home/colletdr/staging.collegiansharriers.co.za:
#   STAGING_FTP_USERNAME and STAGING_FTP_PASSWORD
# With neither, the package is still built and checked, but not uploaded.

name: Deploy staging

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'List what would be uploaded without changing the staging site'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  SSH_HOST: eivor.aserv.co.za
  SSH_USER: colletdr
  SSH_TARGET: /home/colletdr/staging.collegiansharriers.co.za/
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}

jobs:
  build:
    # The package builder uses Windows paths, as it does on the maintainer's PC.
    runs-on: windows-latest
    outputs:
      commit: ${{ steps.build.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and validate the staging package
        id: build
        shell: pwsh
        run: |
          .\scripts\build-deployment-package.ps1 -Channel staging
          $commit = (git rev-parse --short=8 HEAD).Trim()
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "site=dist/staging-$commit/site/" >> $env:GITHUB_OUTPUT

      - name: Keep the package for the upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-site
          path: ${{ steps.build.outputs.site }}
          # .htaccess must travel with the site.
          include-hidden-files: true
          retention-days: 7

  upload:
    needs: build
    # OpenSSH and GNU tar come with the Linux runner.
    runs-on: ubuntu-latest
    outputs:
      uploaded: ${{ steps.mode.outputs.uploaded }}
    env:
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '24' }}
      FTP_CONNECTED: ${{ secrets.STAGING_FTP_USERNAME != '' && secrets.STAGING_FTP_PASSWORD != '' }}
    steps:
      - name: Choose how to upload
        id: mode
        run: |
          if [ -n "$SSH_KEY" ]; then mode=ssh
          elif [ "$FTP_CONNECTED" = true ]; then mode=ftp
          else mode=none; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" != none ] && [ "$DRY_RUN" != true ]; then echo "uploaded=true" >> "$GITHUB_OUTPUT"; fi
          echo "Uploading with: $mode"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.mode.outputs.mode != 'none'
        with:
          name: staging-site
          path: site

      # Only the upload script is needed from the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.mode.outputs.mode == 'ssh'
        with:
          path: repo
          sparse-checkout: scripts/ssh-upload.sh
          sparse-checkout-cone-mode: false

      - name: Upload changed files to staging over SSH
        id: ssh
        if: steps.mode.outputs.mode == 'ssh'
        # Falls back to FTPS below if the SSH upload fails.
        continue-on-error: true
        run: bash repo/scripts/ssh-upload.sh

      - name: Upload changed files to staging over FTPS
        if: steps.mode.outputs.mode == 'ftp' || (steps.ssh.outcome == 'failure' && env.FTP_CONNECTED == 'true')
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: eivor.aserv.co.za
          port: 21
          protocol: ftps
          # The server's certificate is valid for this host name, so insist on it.
          security: strict
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          local-dir: site/
          server-dir: ./
          dry-run: ${{ env.DRY_RUN }}

      - name: Stop when SSH failed and there is no FTPS to fall back on
        if: steps.ssh.outcome == 'failure' && env.FTP_CONNECTED != 'true'
        run: |
          echo "::error::The SSH upload failed and no FTP secrets are set to fall back on."
          exit 1

      - name: Note that uploading is not connected yet
        if: steps.mode.outputs.mode == 'none'
        run: |
          echo "::notice::Package built and validated. Not uploaded: add the DEPLOY_SSH_KEY secret (or the STAGING_FTP_* secrets) to connect staging."

  verify:
    needs: [build, upload]
    if: needs.upload.outputs.uploaded == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The drift check compares result pages with the package it finds in dist/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staging-site
          path: dist/staging-${{ needs.build.outputs.commit }}/site

      - name: Confirm staging matches Git
        shell: pwsh
        # -Ref HEAD: check the commit this run deployed, not whatever the branch points at now.
        run: .\scripts\check-published-drift.ps1 -Channel staging -Ref HEAD
