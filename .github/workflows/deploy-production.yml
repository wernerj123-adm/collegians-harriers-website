# Builds the production package from main and uploads it to the live website.
#
# Runs when a release is merged into main, which is the moment the change goes
# public. main is protected, so only a reviewed pull request can trigger this.
# It uses the same package builder and checks as a manual release, uploads only
# files that changed, then runs the drift check against the live site.
#
# Uploads over SSH (rsync) when the DEPLOY_SSH_KEY secret exists: the private
# half of a key authorised for the cPanel account under SSH Access. Optional:
#   DEPLOY_SSH_KNOWN_HOSTS  the server's host key line, to pin it
#   vars.DEPLOY_SSH_PORT    the SSH port, when it is not 22
# Without the key it falls back to FTPS, which needs an FTP account whose home
# directory is the production document root, /home/colletdr/public_html:
#   PRODUCTION_FTP_USERNAME and PRODUCTION_FTP_PASSWORD
# The FTP server on this host refuses uploads with "552 Disk full" whenever the
# shared server disk is nearly full, even with room in the account; SSH writes
# are not affected. With neither, the package is still built and checked, but
# not uploaded, and the release is deployed by hand as before.

name: Deploy production

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'List what would be uploaded without changing the live site'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SSH_HOST: eivor.aserv.co.za
  SSH_USER: colletdr
  SSH_TARGET: /home/colletdr/public_html/
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}

jobs:
  build:
    # The package builder uses Windows paths, as it does on the maintainer's PC.
    runs-on: windows-latest
    outputs:
      commit: ${{ steps.build.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Enough history to find the commit staging is serving.
          fetch-depth: 50

      - name: Build and validate the production package
        id: build
        shell: pwsh
        run: |
          .\scripts\build-deployment-package.ps1 -Channel production
          $commit = (git rev-parse --short=8 HEAD).Trim()
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "site=dist/production-$commit/site/" >> $env:GITHUB_OUTPUT

      # The live site must never be given a package that staging has not served.
      # Staging deploys from develop, so a release promoted by merge commit has
      # the same content; this checks that rather than assuming it.
      - name: Check the same content is live on staging
        shell: pwsh
        run: |
          $manifest = Invoke-RestMethod -Uri 'https://staging.collegiansharriers.co.za/deployment-manifest.json' -Headers @{ 'Cache-Control' = 'no-cache' }
          $staged = $manifest.sourceCommit
          git cat-file -e "$staged^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw "The commit staging serves ($($staged.Substring(0,8))) is not in the fetched history, so this release cannot be compared with it. Check staging by hand before releasing."
          }
          if ((git rev-parse "HEAD^{tree}") -ne (git rev-parse "$staged^{tree}")) {
            throw "Staging serves $($staged.Substring(0,8)), whose content differs from this release. Deploy it to staging and check it before releasing."
          }
          Write-Host "Staging serves $($staged.Substring(0,8)), the same content as this release."

      - name: Keep the package for the upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-site
          path: ${{ steps.build.outputs.site }}
          # .htaccess must travel with the site.
          include-hidden-files: true
          retention-days: 7

  upload:
    needs: build
    # rsync and OpenSSH come with the Linux runner.
    runs-on: ubuntu-latest
    outputs:
      uploaded: ${{ steps.mode.outputs.uploaded }}
    env:
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      FTP_CONNECTED: ${{ secrets.PRODUCTION_FTP_USERNAME != '' && secrets.PRODUCTION_FTP_PASSWORD != '' }}
    steps:
      - name: Choose how to upload
        id: mode
        run: |
          if [ -n "$SSH_KEY" ]; then mode=ssh
          elif [ "$FTP_CONNECTED" = true ]; then mode=ftp
          else mode=none; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" != none ] && [ "$DRY_RUN" != true ]; then echo "uploaded=true" >> "$GITHUB_OUTPUT"; fi
          echo "Uploading with: $mode"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.mode.outputs.mode != 'none'
        with:
          name: production-site
          path: site

      - name: Upload changed files to the live site over SSH
        if: steps.mode.outputs.mode == 'ssh'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -t ed25519,rsa "$SSH_HOST" > ~/.ssh/known_hosts
            echo "::warning::Host key not pinned. Save this as the DEPLOY_SSH_KNOWN_HOSTS secret: $(head -n1 ~/.ssh/known_hosts)"
          fi
          flags=(--recursive --checksum --compress --itemize-changes --chmod=D755,F644)
          if [ "$DRY_RUN" = true ]; then flags+=(--dry-run); fi
          # No --delete: the document root also holds files the package does
          # not own (.well-known, .user.ini). Retired files are removed by hand.
          rsync "${flags[@]}" \
            -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            site/ "$SSH_USER@$SSH_HOST:$SSH_TARGET"
          rm -f ~/.ssh/deploy_key

      - name: Upload changed files to the live site over FTPS
        if: steps.mode.outputs.mode == 'ftp'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: eivor.aserv.co.za
          port: 21
          protocol: ftps
          # The server's certificate is valid for this host name, so insist on it.
          security: strict
          username: ${{ secrets.PRODUCTION_FTP_USERNAME }}
          password: ${{ secrets.PRODUCTION_FTP_PASSWORD }}
          local-dir: site/
          server-dir: ./
          dry-run: ${{ env.DRY_RUN }}

      - name: Note that uploading is not connected yet
        if: steps.mode.outputs.mode == 'none'
        run: |
          echo "::notice::Package built and validated. Not uploaded: add the DEPLOY_SSH_KEY secret (or the PRODUCTION_FTP_* secrets) to connect the live site. Upload dist/ by hand until then."

  verify:
    needs: [build, upload]
    if: needs.upload.outputs.uploaded == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50

      # The drift check compares result pages with the package it finds in dist/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-site
          path: dist/production-${{ needs.build.outputs.commit }}/site

      - name: Confirm the live site matches Git
        shell: pwsh
        # -Ref HEAD: check the commit this run deployed, not whatever the branch points at now.
        run: .\scripts\check-published-drift.ps1 -Channel production -Ref HEAD
